server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ไฟล์ที่ vite ใส่ hash ไว้ในชื่อแล้ว cache ยาว ๆ ได้
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # แอปหน้าเดียว ไม่มี router ฝั่ง server — path ไหนไม่เจอไฟล์ให้ตกมาที่ index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip             on;
    gzip_types       text/css application/javascript image/svg+xml;
    gzip_min_length  1024;
}

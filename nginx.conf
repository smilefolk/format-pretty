# หน้าแรกมีสองภาษา (build ด้วย src/lib/seo.js): /?lang=en ได้ index.en.html ที่ <head> เป็นอังกฤษ
# (title / description / canonical / og) ให้ Google index แยกจากหน้าไทย — ตัวแอปเลือกภาษาจาก ?lang เองอยู่แล้ว
map $arg_lang $home_page {
    en      /index.en.html;
    default /index.html;
}

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;
    charset      utf-8;

    # ไม่ประกาศเวอร์ชัน nginx ใน header และหน้า error
    server_tokens off;

    # ไฟล์ที่ vite ใส่ hash ไว้ในชื่อแล้ว cache ยาว ๆ ได้
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ฟอนต์ self-host ชื่อไฟล์คงที่ (ไม่มี hash) — ถ้าเปลี่ยนไฟล์ฟอนต์ต้องเปลี่ยนชื่อไฟล์ด้วย
    # ไม่งั้นเบราว์เซอร์ที่ cache ไว้จะยังใช้ของเก่าจนครบปี
    location /fonts/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # หน้า html ต้องถามเซิร์ฟเวอร์ทุกครั้ง ไม่งั้น deploy ใหม่แล้วเบราว์เซอร์ยังชี้ asset hash ชุดเก่า
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $home_page =404;
    }

    # public/_headers เป็น config ของ Cloudflare ที่ติดมาใน dist — ไม่ต้องเสิร์ฟ
    location = /_headers {
        return 404;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # แอปไม่มี router — URL ที่ใช้ได้มีแค่ / (กับ ?lang=en) และไฟล์ที่มีจริง
    # path อื่นตอบ 404 แต่ยังแสดงแอปให้คนที่พิมพ์ผิด (ถ้าตอบ 200 Google จะเห็นเป็น soft 404 / หน้าซ้ำ)
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
        error_page 404 /index.html;
    }

    gzip             on;
    gzip_vary        on;
    # woff2 บีบอัดมาในตัวแล้ว ไม่ต้องใส่ในนี้
    gzip_types       text/css application/javascript image/svg+xml;
    gzip_min_length  1024;
}

# หัว header ความปลอดภัย — include ไฟล์นี้ในทุก location
#
# nginx ไม่สืบทอด add_header จากบล็อกแม่ ถ้า location นั้นมี add_header ของตัวเอง
# (ทุก location ที่นี่ตั้ง Cache-Control เอง) จึงต้อง include ซ้ำทุกบล็อก ไม่ใช่ประกาศครั้งเดียวที่ระดับ server
#
# CSP: แอปไม่มี backend และไม่ยิง request ออกนอกเครื่องเลย → connect-src 'none'
# ถ้าวันหลังมีโค้ดเรียก fetch/XHR ขึ้นมา เบราว์เซอร์จะบล็อกให้เห็นทันที ซึ่งเป็นสิ่งที่ต้องการ
# - style-src ต้องมี 'unsafe-inline' เพราะ JsonTree / CodeView / Compare ใส่ style attribute
#   (ระยะเยื้องตามความลึก, ความสูงของช่วงที่ไม่ได้เรนเดอร์, สีแถบ diff)
# - img-src ต้องมี data: เพราะ favicon ใน index.html เป็น data:image/svg+xml
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
